# TEMPORARY one-shot workflow (issue #2): creates package-lock.json from a clean checkout, commits it to this
# branch, and is deleted in the next commit. It only runs when this file changes on feat/png-alert-mvp.
name: Generate lockfile (temporary)
on:
  push:
    branches: [feat/png-alert-mvp]
    paths: [.github/workflows/generate-lockfile.yml]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json generated from a clean checkout"
          git pull --rebase origin feat/png-alert-mvp
          git push origin HEAD:feat/png-alert-mvp
